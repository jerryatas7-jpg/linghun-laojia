<style>

--line:#e8d9bf;
--accent:#b4552d;

--shadow:0 10px 30px rgba(90,58,20,.10);

}
@media (prefers-color-scheme: dark){

--paper:#211a14;
--paper-2:#2a2119;
--card:#2e251c;

--line:#463728;
--accent:#e07a4a;

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:
radial-gradient(ellipse 600px 300px at 15% -5%, rgba(212,148,78,.16), transparent 60%),
radial-gradient(ellipse 500px 260px at 95% 8%, rgba(180,85,45,.10), transparent 60%),
var(--paper);

}

.wrap{max-width:560px;margin:0 auto;padding:20px 18px 28px;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button,[role="button"]{min-height:48px}

.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}

/* ---------- start ---------- */
.start-hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 8px;text-align:center}
.stamp{
align-self:center;display:inline-flex;align-items:center;gap:8px;
border:1.5px solid var(--accent);color:var(--accent);
padding:6px 14px;border-radius:999px;font-size:13px;letter-spacing:.14em;font-weight:700;
transform:rotate(-2deg);margin-bottom:22px;background:var(--card);
}
h1.title{font-size:42px;line-height:1.18;margin:0 0 14px;font-weight:900;letter-spacing:.01em}
h1.title em{font-style:normal;color:var(--accent)}
.subtitle{font-size:17px;color:var(--ink-2);margin:0 0 8px}
.start-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.chip{font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
.btn-primary{
width:100%;border:none;background:var(--accent);color:var(--accent-ink);
font-size:19px;font-weight:800;padding:17px 20px;border-radius:999px;
box-shadow:0 12px 24px rgba(180,85,45,.28);letter-spacing:.04em;
}
.btn-primary:active{transform:scale(.985)}
.btn-ghost{
width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
font-size:16px;font-weight:700;padding:15px 20px;border-radius:999px;
}
.city-preview{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.city-preview span{font-size:14px;padding:6px 12px;border-radius:999px;color:#fff;font-weight:700}
.start-note{font-size:13px;color:var(--ink-3);margin-top:16px}

/* ---------- quiz ---------- */
.progress-row{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.progress-track{flex:1;height:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width.35s ease;width:0%}
.progress-text{font-size:13px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px 20px}
.q-kicker{font-size:13px;letter-spacing:.16em;color:var(--accent);font-weight:800;margin-bottom:8px}
.q-text{font-size:24px;line-height:1.4;font-weight:800;margin:0 0 20px}
.options{display:flex;flex-direction:column;gap:12px}
.opt{
text-align:left;width:100%;border:1.5px solid var(--line);background:var(--paper);
border-radius:16px;padding:16px 16px;display:flex;gap:12px;align-items:flex-start;
font-size:16.5px;line-height:1.5;color:var(--ink);transition:border-color.15s, background.15s, transform.1s;
}
.opt:active{transform:scale(.99)}
.opt.letter{
flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent);margin-top:1px;
}
.opt.selected{border-color:var(--accent);background:#fdf0e2}
@media (prefers-color-scheme: dark){.opt.selected{background:#3d2b1d}}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.link-btn{background:none;border:none;color:var(--ink-3);font-size:14px;padding:10px 6px;min-height:44px}
.link-btn:disabled{opacity:.35}
.hint{font-size:13px;color:var(--ink-3)}

/* ---------- result ---------- */
.result-banner{
border-radius:24px;padding:28px 22px 24px;color:#fff;text-align:center;position:relative;overflow:hidden;
box-shadow:var(--shadow);
}
.result-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 300px 160px at 85% 0%, rgba(255,255,255,.28), transparent 65%);pointer-events:none}
.result-label{font-size:13px;letter-spacing:.22em;opacity:.92;font-weight:700}
.result-city{font-size:56px;line-height:1.1;font-weight:900;margin:8px 0 8px;letter-spacing:.04em}
.result-slogan{font-size:17px;line-height:1.55;margin:0 auto;max-width:26em;font-weight:600}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-top:16px}
.sec-title{font-size:13px;letter-spacing:.16em;color:var(--accent);font-weight:800;margin:0 0 12px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:15px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.desc{font-size:16.5px;line-height:1.75;margin:0;color:var(--ink)}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.reasons li{display:flex;gap:10px;font-size:16px;line-height:1.65;align-items:flex-start}
.reasons .n{flex:0 0 24px;width:24px;height:24px;min-width:24px;min-height:24px;align-self:flex-start;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;line-height:1}
.share-box{background:var(--paper-2);border:1px dashed var(--ink-3);border-radius:14px;padding:16px;font-size:16px;line-height:1.65}
.result-actions{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.toast{
position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
background:#2e2118;color:#fdf7ec;padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:600;
opacity:0;pointer-events:none;transition:all.25s ease;z-index:50;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.25)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{margin-top:auto;padding-top:22px;text-align:center;font-size:12.5px;color:var(--ink-3);line-height:1.6}
@media (max-width:380px){ h1.title{font-size:36px}.result-city{font-size:48px}.q-text{font-size:22px}}

var current = 0;
var answers = [];
var letters = ["A","B","C","D"];

function show(id){
var screens = document.querySelectorAll(".screen");
for(var i=0;i<screens.length;i++) screens[i].classList.remove("active");
document.getElementById(id).classList.add("active");
window.scrollTo(0,0);
}

function renderQuestion(){
var item = QUESTIONS[current];
document.getElementById("q-kicker").textContent = "第 " + (current+1) + " 题 · 共 8 题";
document.getElementById("q-text").textContent = item.q;
document.getElementById("progress-text").textContent = (current+1) + " / 8";
document.getElementById("progress-fill").style.width = ((current)/QUESTIONS.length*100) + "%";
document.getElementById("btn-prev").disabled = current===0;
var box = document.getElementById("options");
box.innerHTML = "";
item.options.forEach(function(opt, idx){
var b = document.createElement("button");
b.type = "button";
b.className = "opt" + (answers[current]===idx? " selected": "");
b.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+opt.t+'</span>';
b.addEventListener("click", function(){ pick(idx, b);});
box.appendChild(b);
});
}

function pick(idx, btn){
answers[current] = idx;
var opts = document.querySelectorAll(".opt");
for(var i=0;i<opts.length;i++) opts[i].classList.remove("selected");
btn.classList.add("selected");
document.getElementById("progress-fill").style.width = ((current+1)/QUESTIONS.length*100) + "%";
setTimeout(function(){
if(current < QUESTIONS.length-1){ current++; renderQuestion();}
else { showResult();}
}, 260);
}

function calcResult(){
var scores = {};
Object.keys(RESULTS).forEach(function(k){ scores[k]=0;});
answers.forEach(function(ans, qi){
if(ans===undefined) return;
var s = QUESTIONS[qi].options[ans].s;
Object.keys(s).forEach(function(city){ scores[city]+=s[city];});
});
var max = -1;
Object.keys(scores).forEach(function(k){ if(scores[k]>max) max=scores[k];});
var tops = Object.keys(scores).filter(function(k){ return scores[k]===max;});
return tops[Math.floor(Math.random()*tops.length)];
}

function showResult(){
var city = calcResult();
var r = RESULTS[city];
document.getElementById("result-banner").style.background = "linear-gradient(150deg,"+r.color+","+r.color+"dd 55%, #2e2118)";
document.getElementById("result-city").textContent = city;
document.getElementById("result-slogan").textContent = r.slogan;
var tagsBox = document.getElementById("result-tags");
tagsBox.innerHTML = "";
r.tags.forEach(function(t){
var s=document.createElement("span"); s.className="tag"; s.textContent=t; tagsBox.appendChild(s);
});
document.getElementById("result-desc").textContent = r.desc;
var list = document.getElementById("result-reasons");
list.innerHTML = "";
r.reasons.forEach(function(text, i){
var li=document.createElement("li");
li.innerHTML = '<span class="n" style="background:'+r.color+'">'+(i+1)+'</span><span>'+text+'</span>';
list.appendChild(li);
});
document.getElementById("result-share").textContent = r.share;
document.getElementById("btn-copy").setAttribute("data-share", r.share);
show("screen-result");
}

function toast(msg){
var t=document.getElementById("toast");
t.textContent=msg; t.classList.add("show");
setTimeout(function(){ t.classList.remove("show");}, 2000);
}

document.getElementById("btn-start").addEventListener("click", function(){
current=0; answers=[]; renderQuestion(); show("screen-quiz");
});
document.getElementById("btn-prev").addEventListener("click", function(){
if(current>0){ current--; renderQuestion();}
});
document.getElementById("btn-retake").addEventListener("click", function(){
current=0; answers=[]; show("screen-start");
});
document.getElementById("btn-copy").addEventListener("click", function(){
var text = this.getAttribute("data-share") || "";
function done(){ toast("已复制，去发给朋友吧 ✓");}
function fallback(){
var ta=document.createElement("textarea");
ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
document.body.appendChild(ta); ta.select();
try{ document.execCommand("copy"); done();}catch(e){ toast("复制失败，长按文案手动复制");}
document.body.removeChild(ta);
}
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(done).catch(fallback);
} else { fallback();}
});
</script>
